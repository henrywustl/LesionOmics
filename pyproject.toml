[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lesionomics"
version = "0.1.0"
description = "Modality-agnostic lesion quantification toolkit for 3D neuroimaging"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "nibabel>=5.0",
    "antspyx>=0.4.2",
    "scikit-image>=0.21",
    "scipy>=1.11",
    "pandas>=2.0",
    "pyradiomics>=3.1",
    "SimpleITK>=2.3",
    "trimesh>=3.21",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]
